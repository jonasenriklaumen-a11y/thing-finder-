# cortex im Container -- isoliert vom System, ohne Netzbeschraenkung.
#
#   docker compose run --rm cortex                    # Chat
#   docker compose run --rm cortex "deine Frage"      # einmalig
#   docker compose run --rm cortex search "test"      # nur Suche
#
# Mit eigener Suchmaschine (SearXNG, kein API-Key noetig):
#   docker compose --profile searxng up -d searxng
#   docker compose --profile searxng run --rm cortex

services:
  cortex:
    build:
      context: .
      target: ${CORTEX_IMAGE_TARGET:-browser}
    image: cortex:local
    # Laeuft unter der UID des Host-Nutzers, damit Exporte in ./exports
    # dem richtigen Benutzer gehoeren. `cortex-box` setzt die Werte; ohne
    # Wrapper gilt der eingebaute Benutzer (UID 1000).
    user: "${CORTEX_UID:-1000}:${CORTEX_GID:-1000}"
    # Keys und Voreinstellungen kommen aus der .env im Projektverzeichnis.
    env_file:
      - path: .env
        required: false
    environment:
      CORTEX_DATA_DIR: /data
      # Wird nur benutzt, wenn CORTEX_SEARCH_BACKEND=searxng gesetzt ist.
      CORTEX_SEARXNG_URL: ${CORTEX_SEARXNG_URL:-http://searxng:8080}
    volumes:
      # Cache und Verlauf ueberleben den Container.
      - cortex-data:/data
      # Exporte landen im Projektverzeichnis unter ./exports.
      - ./exports:/work
    stdin_open: true
    tty: true
    init: true
    # Volles Netz nach draussen -- ohne das kann cortex nicht recherchieren.
    # Isoliert wird das Dateisystem, nicht die Verbindung.
    #
    # Fuer Heimnetz und Home Assistant braucht cortex die Netzwerkkarte des
    # Rechners: aus Dockers eigenem Bruecken-Netz ist das Heimnetz nicht zu
    # sehen, `cortex lan` und `connect-ha` faenden dort schlicht nichts.
    #   CORTEX_NETWORK=host docker compose run --rm cortex
    # Ohne die Variable bleibt es beim abgeschotteten Bruecken-Netz.
    network_mode: ${CORTEX_NETWORK:-bridge}
    security_opt:
      - no-new-privileges:true
    # Chromium legt seine Shared-Memory-Segmente hier ab.
    shm_size: 512m

  # Optional: eigene Metasuchmaschine, damit auch die Suche im Haus bleibt.
  searxng:
    profiles: [searxng]
    image: searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./docker/searxng:/etc/searxng:rw
    environment:
      SEARXNG_BASE_URL: http://localhost:8080/
    security_opt:
      - no-new-privileges:true

volumes:
  cortex-data:
