[project]
name = "aquaticy"
version = "9.4.8"
description = "Ein KI-Agent fuer Kommandozeile und Browser, der eigenstaendig das Web durchsucht, Seiten liest und die Ergebnisse ausgewertet zurueckgibt."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jonas" }]
keywords = ["cli", "agent", "llm", "research", "web-search", "web-ui"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "litellm>=1.100.0",
    "typer>=0.27.2",
    "rich>=15.0.0",
    "httpx>=0.28.1",
    "selectolax>=0.4.11",
    "trafilatura>=2.2.0",
    "ddgs>=9.16.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.3",
    "PyYAML>=6.0.3",
    "pypdf>=6.18.0",
    "cryptography>=50.0.1",
]

[project.optional-dependencies]
browser = ["playwright>=1.62.0"]
images = ["term-image>=0.7"]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
]

[project.scripts]
aquaticy = "aquaticy.cli:main"

[project.urls]
Homepage = "https://github.com/jonasenriklaumen-a11y/thing-finder-"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aquaticy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
