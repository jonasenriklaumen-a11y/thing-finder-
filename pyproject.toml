[project]
name = "aquaticy"
version = "9.5.18"
description = "Ein KI-Agent fuer Kommandozeile und Browser, der eigenstaendig das Web durchsucht, Seiten liest und die Ergebnisse ausgewertet zurueckgibt."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Jonas" }]
keywords = ["cli", "agent", "llm", "research", "web-search", "web-ui"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Seit 9.5.15 nach oben begrenzt: die naechste grosse Fassung darf eine
    # Installation nicht unbemerkt brechen. Reproduzierbar genau installiert
    # wird mit constraints.txt (siehe README, "Entwicklung").
    "litellm>=1.100.0,<2",
    "typer>=0.27.2,<1",
    "rich>=15.0.0,<16",
    "httpx>=0.28.1,<0.29",
    "httpcore>=1.0.9,<2",
    "selectolax>=0.4.11,<0.5",
    "trafilatura>=2.2.0,<3",
    "ddgs>=9.16.0,<10",
    "pydantic>=2.13.5,<3",
    "pydantic-settings>=2.15.0,<3",
    "python-dotenv>=1.2.3,<2",
    "PyYAML>=6.0.3,<7",
    "pypdf>=6.18.0,<7",
    "cryptography>=50.0.1,<52",
]

[project.optional-dependencies]
browser = ["playwright>=1.62.0,<2"]
images = ["term-image>=0.7,<0.8"]
dev = [
    "pytest>=8.2,<10",
    "pytest-asyncio>=0.23,<2",
    "respx>=0.21,<0.24",
    "ruff>=0.5,<0.20",
]

[project.scripts]
aquaticy = "aquaticy.cli:main"

[project.urls]
Homepage = "https://github.com/jonasenriklaumen-a11y/Aquaticy-Ai"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aquaticy"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
